[env:esp32cam]
platform = espressif32@5.2.0
board = esp32cam
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv

upload_speed = 921600
monitor_speed = 115200

lib_deps = 
    bblanchon/ArduinoJson@^7.4.2

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_rts = 0
monitor_dtr = 0